# Render 一键部署蓝图（Blueprint）
# 在 Render 控制台选择 New -> Blueprint，连接本仓库即可自动按此配置部署
services:
  - type: web
    name: milk-tea-approval
    runtime: node
    plan: free
    branch: main
    buildCommand: "npm install"
    startCommand: "node server.js"
    healthCheckPath: /
    envVars:
      - key: PORT
        value: "3000"
